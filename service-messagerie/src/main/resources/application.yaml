server:
  port: 8089

spring:
  application:
    name: SERVICE-MESSAGERIE
  datasource:
    url: jdbc:postgresql://postgres-messagerie:5432/messagerie_db
    username: messagerie_user
    password: messagerie_password
    driver-class-name: org.postgresql.Driver

  cloud:
    config:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: "ma-cle-secrete-temporaire-a-remplacer-plus-tard-avec-une-vraie-cle-longue"

services:
  user-service-url: http://service-utilisateur:8082

management:
  endpoints:
    web:
      exposure:
        include: "*"
