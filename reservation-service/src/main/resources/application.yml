server:
  port: 8086

spring:
  application:
    name: service-reservation

  datasource:
    url: jdbc:postgresql://localhost:5432/reservation_db
    username: postgres
    password: Pos123,.

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: TA_CLE_SECRETE
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"