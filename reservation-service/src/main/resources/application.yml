server:
  port: 8086

spring:
  application:
    name: reservation-service

  datasource:
    url: jdbc:postgresql://localhost:5432/reservation_db
    username: postgres
    password: Pos123,.

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: "ma-cle-secrete-temporaire-a-remplacer-plus-tard-avec-une-vraie-cle-longue"
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"