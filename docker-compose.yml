services:
  postgres-auth:
    image: postgres:16
    container_name: postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "55432:5432"
    volumes:
      - postgres_auth_data_clean:/var/lib/postgresql/data

volumes:
  postgres_auth_data_clean: