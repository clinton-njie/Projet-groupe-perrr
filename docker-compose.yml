services:
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - projet-immo-network

  postgres-auth:
    image: postgres:15
    container_name: postgres-auth
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - projet-immo-network

  db-signalements:
    image: postgres:15
    container_name: db-signalements
    environment:
      POSTGRES_DB: signalements_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d signalements_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - projet-immo-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      postgres-auth:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - projet-immo-network

  service-signalements:
    build: ./service-signalements
    container_name: service-signalements
    ports:
      - "8086:8086"
    depends_on:
      db-signalements:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-signalements:5432/signalements_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - projet-immo-network

  api-gateway:
    build: ./service-api-gateway
    container_name: api-gateway
    ports:
      - "8222:8222"
    depends_on:
      - eureka-server
    networks:
      - projet-immo-network

networks:
  projet-immo-network:
    driver: bridge