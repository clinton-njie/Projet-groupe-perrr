services:
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - projet-immo-network

  postgres-auth:
    image: postgres:15
    container_name: postgres-auth
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "55432:5432"
    networks:
      - projet-immo-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - postgres-auth
    networks:
      - projet-immo-network

  api-gateway:
    build: ./service-api-gateway
    container_name: api-gateway
    ports:
      - "8222:8222"
    depends_on:
      - eureka-server
    networks:
      - projet-immo-network

  postgres-user:
    image: postgres:15
    container_name: postgres-user
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_password
    ports:
      - "55433:5432"
    networks:
      - projet-immo-network

  service-utilisateur:
    build: ./service-user
    container_name: service-utilisateur
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - postgres-user
    networks:
      - projet-immo-network

  postgres-messagerie:
    image: postgres:15
    container_name: postgres-messagerie
    environment:
      POSTGRES_DB: messagerie_db
      POSTGRES_USER: messagerie_user
      POSTGRES_PASSWORD: messagerie_password
    ports:
      - "55434:5432"
    networks:
      - projet-immo-network

  service-messagerie:
    build: ./service-messagerie
    container_name: service-messagerie
    ports:
      - "8086:8086"
    depends_on:
      - eureka-server
      - postgres-messagerie
    networks:
      - projet-immo-network

  postgres-abonnement:
    image: postgres:15
    container_name: abonnement-db
    environment:
      POSTGRES_DB: abonnement_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    volumes:
      - abonnement_data:/var/lib/postgresql/data
    networks:
      - projet-immo-network

  abonnement-service:
    build: ./abonnement-service
    container_name: abonnement-service
    depends_on:
      - postgres-abonnement
    ports:
      - "8087:8087"
    networks:
      - projet-immo-network

  postgres-reservation:
    image: postgres:15
    container_name: reservation-db
    environment:
      POSTGRES_DB: reservation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5437:5432"
    volumes:
      - reservation_data:/var/lib/postgresql/data
    networks:
      - projet-immo-network

  reservation-service:
    image: reservation-service-reservation-service:latest
    container_name: reservation-service
    depends_on:
      - postgres-reservation
    ports:
      - "8088:8088"
    networks:
      - projet-immo-network

volumes:
  abonnement_data:
  reservation_data:

networks:
  projet-immo-network:
    driver: bridge
