services:
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - projet-immo-network

  api-gateway:
    build: ./service-api-gateway
    container_name: api-gateway
    ports:
      - "8222:8222"
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - projet-immo-network

networks:
  projet-immo-network:
    driver: bridge
