spring:
  application:
    name: ms-avis
  profiles:
    active: local
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

jwt:
  # Secret partagé par toute la plateforme (auth-service émet, les services vérifient).
  # Doit rester identique à auth/reservation/visite sinon la vérification de signature échoue.
  secret: ${JWT_SECRET:ma-cle-secrete-temporaire-a-remplacer-plus-tard-avec-une-vraie-cle-longue}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/db_ms_avis
    username: user_immo
    password: password_immo
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8089

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres-avis:5432/db_ms_avis
    username: user_immo
    password: password_immo
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8089

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/