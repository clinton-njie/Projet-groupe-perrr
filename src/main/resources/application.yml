server:
  port: 8081

spring:
  application:
    name: AUTH-SERVICE

  cloud:
    discovery:
      enabled: true

  datasource:
    url: "jdbc:postgresql://postgres-auth:5432/authdb"
    username: "auth_user"
    password: "auth_password"
    driver-class-name: "org.postgresql.Driver"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

  instance:
    prefer-ip-address: true

jwt:
  secret: "ma-cle-secrete-temporaire-a-remplacer-plus-tard-avec-une-vraie-cle-longue"
  access-token-expiration: 300000
  refresh-token-expiration: 604800000

