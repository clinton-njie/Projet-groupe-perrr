server:
  port: 8082
spring:
  application:
    name: SERVICE-UTILISATEUR
  datasource:
    url: jdbc:postgresql://postgres-user:5432/userdb
    username: user_service
    password: user_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
jwt:
  secret: "ma-cle-secrete-temporaire-a-remplacer-plus-tard-avec-une-vraie-cle-longue"
services:
  auth-service-url: http://auth-service:8081
management:
  endpoints:
    web:
      exposure:
        include: "*"
