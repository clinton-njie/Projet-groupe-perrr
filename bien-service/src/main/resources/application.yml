server:
  port: 8084

spring:
  application:
    name: bien-service

  datasource:
    url: "jdbc:postgresql://postgres-bien:5432/biendb"
    username: "bien_user"
    password: "bien_password"
    driver-class-name: "org.postgresql.Driver"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Taille max des fichiers image envoyés à l'upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# Credentials Cloudinary — JAMAIS en dur : injectés via variables d'environnement.
# Renseignez CLOUDINARY_CLOUD_NAME / CLOUDINARY_API_KEY / CLOUDINARY_API_SECRET
# dans votre environnement (voir docker-compose.yml ou export shell).
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: "ma-cle-secrete-temporaire-a-remplacer-plus-tard-avec-une-vraie-cle-longue"
  access-token-expiration: 300000

actuator:
  endpoints:
    web:
      exposure:
        include: health,info
