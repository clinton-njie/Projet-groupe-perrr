services:

  mysql-visite:
    image: mysql:8.0
    container_name: mysql-visite
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: service_visite_db
      MYSQL_INNODB_BUFFER_POOL_SIZE: 128M
    ports:
      - "3307:3306"
    volumes:
      - mysql_visite_data:/var/lib/mysql
    networks:
      - projet-immo-network
    mem_limit: 512m

  service-visite:
    build: .
    container_name: service-visite
    restart: unless-stopped
    ports:
      - "8085:8085"
    depends_on:
      - mysql-visite
      - kafka-visite
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-visite:3306/service_visite_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-visite:9092
    networks:
      - projet-immo-network
    mem_limit: 512m

  kafka-visite:
    image: apache/kafka:3.8.0
    container_name: kafka-visite
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-visite:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-visite:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - projet-immo-network
    mem_limit: 512m

networks:
  projet-immo-network:
    external: true
    name: projet-groupe-perrr_projet-immo-network

volumes:
  mysql_visite_data: